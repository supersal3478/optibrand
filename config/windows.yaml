# Activity windows in user-local time (24h). Times outside the window: scheduler skips.
# Days: 0=Mon ... 6=Sun. Empty list = all days.

youtube:
  inbound:
    days: []                  # 24/7 — moderation can't wait
    start: "00:00"
    end:   "23:59"

x:
  # Narrowed 2026-07-02 (recovery ramp): the 24/7 window let cadence sessions
  # land at 3-5am Toronto — machine-like for a throttled account rebuilding
  # trust. 09:00-22:00 keeps all activity in plausibly-human hours. Trade-off:
  # goodwill no longer precedes the overnight SGT posts (03:30/05:30 Toronto);
  # widen again only after the account is back in good standing.
  inbound:
    days: [0, 1, 2, 3, 4, 5, 6]
    start: "09:00"
    end:   "22:00"
  outbound:
    days: [0, 1, 2, 3, 4, 5, 6]
    start: "09:00"
    end:   "22:00"

linkedin:
  inbound:
    days: [0, 1, 2, 3, 4]
    start: "08:00"
    end:   "19:00"
  outbound:
    days: [0, 1, 2, 3, 4]
    start: "09:00"
    end:   "17:00"

timezone: America/Toronto    # IANA name; matches BGE_TIMEZONE in ~/.hermes/.env
