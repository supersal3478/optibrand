# Activity windows in user-local time (24h). Times outside the window: scheduler skips.
# Days: 0=Mon ... 6=Sun. Empty list = all days.

youtube:
  inbound:
    days: []                  # 24/7 — moderation can't wait
    start: "00:00"
    end:   "23:59"

x:
  # Windows widened 2026-06-17 to cover SGT posting schedule converted to
  # Toronto local. Your goodwill triggers fire at Toronto 03:30, 05:30, 09:30,
  # 13:30, 18:30, 20:30 — old 09:00–18:00 outbound window excluded 4 of 6 trips.
  # Caps + hold-buffer + jitter remain the real volume/safety controls.
  inbound:
    days: [0, 1, 2, 3, 4, 5, 6]
    start: "00:00"
    end:   "23:59"
  outbound:
    days: [0, 1, 2, 3, 4, 5, 6]   # 7 days/week — SGT posting is 6/day every day
    start: "00:00"
    end:   "23:59"

linkedin:
  inbound:
    days: [0, 1, 2, 3, 4]
    start: "08:00"
    end:   "19:00"
  outbound:
    days: [0, 1, 2, 3, 4]
    start: "09:00"
    end:   "17:00"

timezone: America/Toronto    # IANA name; matches BGE_TIMEZONE in ~/.hermes/.env
